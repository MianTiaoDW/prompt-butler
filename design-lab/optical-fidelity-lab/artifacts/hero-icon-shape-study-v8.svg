<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="1" stop-color="#030409"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121827"/>
      <stop offset="0.48" stop-color="#070A12"/>
      <stop offset="1" stop-color="#03050B"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.12" y1="0.08" x2="0.88" y2="0.94">
      <stop offset="0" stop-color="#E3EEFF"/>
      <stop offset="0.34" stop-color="#B5CEFF"/>
      <stop offset="0.90" stop-color="#86AAF5"/>
      <stop offset="1" stop-color="#8C79DA"/>
    </linearGradient>
    <linearGradient id="markSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFD5FF"/>
      <stop offset="0.94" stop-color="#86A9F4"/>
      <stop offset="1" stop-color="#8E7CDD"/>
    </linearGradient>
    <style>
      .cell { fill: #0A0D15; stroke: #9CB9F5; stroke-opacity: .10; }
      .shell-edge { fill: none; stroke: #8DABEA; stroke-opacity: .42; stroke-width: 2; }
      .shell-highlight { fill: none; stroke: #ECF3FF; stroke-opacity: .36; stroke-width: 3; stroke-linecap: round; }
      .mark-stroke { fill: none; stroke: url(#mark); stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #F3F6FF; font: 600 38px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.8px; }
      .subtitle { fill: #8D96AA; font: 400 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #EDF2FF; font: 600 22px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .meta { fill: #8791A5; font: 400 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .size { fill: #626D82; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>

    <g id="shell-master">
      <rect x="18" y="18" width="284" height="284" rx="82" fill="url(#shell)"/>
      <rect class="shell-edge" x="19" y="19" width="282" height="282" rx="81"/>
      <path class="shell-highlight" d="M70 39 C119 20 201 20 250 39"/>
      <path d="M43 242 C68 279 107 296 160 296 C213 296 252 279 277 242" fill="none" stroke="#697FDB" stroke-opacity=".20" stroke-width="3" stroke-linecap="round"/>
    </g>

    <symbol id="icon-ai" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path d="M91 112 C103 77 141 62 176 78 L196 96 C164 102 142 121 132 148 C123 174 128 202 148 224 C111 221 81 193 78 158 C76 141 81 124 91 112 Z" fill="url(#mark)"/>
      <path d="M229 208 C217 243 179 258 144 242 L124 224 C156 218 178 199 188 172 C197 146 192 118 172 96 C209 99 239 127 242 162 C244 179 239 196 229 208 Z" fill="url(#markSoft)"/>
      <path d="M160 119 C168 140 180 152 201 160 C180 168 168 180 160 201 C152 180 140 168 119 160 C140 152 152 140 160 119 Z" fill="#070A12"/>
      <path d="M160 142 C164 151 169 156 178 160 C169 164 164 169 160 178 C156 169 151 164 142 160 C151 156 156 151 160 142 Z" fill="#DDEAFF"/>
      <circle cx="236" cy="84" r="14" fill="url(#mark)"/>
    </symbol>

    <symbol id="icon-warning" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path d="M132 91 L80 211 Q73 227 91 227 H119 L146 167" fill="none" stroke="url(#markSoft)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" opacity=".68"/>
      <path d="M188 91 L240 211 Q247 227 229 227 H201 L174 167" fill="none" stroke="url(#markSoft)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" opacity=".68"/>
      <path d="M160 102 C174 102 181 112 179 128 L171 181 C170 191 166 197 160 197 C154 197 150 191 149 181 L141 128 C139 112 146 102 160 102 Z" fill="url(#mark)"/>
      <circle cx="160" cy="222" r="14" fill="url(#mark)"/>
      <path d="M214 187 L232 225 H214 Z" fill="#8B78D9" opacity=".48"/>
    </symbol>

    <symbol id="icon-success" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path class="mark-stroke" stroke-width="34" d="M94 156 L139 111 Q154 96 169 111 L198 140"/>
      <path class="mark-stroke" stroke-width="38" d="M103 174 L145 214 L231 118"/>
      <path d="M241 78 C244 88 250 94 260 97 C250 100 244 106 241 116 C238 106 232 100 222 97 C232 94 238 88 241 78 Z" fill="url(#markSoft)"/>
    </symbol>

    <symbol id="icon-upload" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path d="M67 205 C85 183 117 175 160 175 C203 175 235 183 253 205" fill="none" stroke="url(#markSoft)" stroke-width="18" stroke-linecap="round" opacity=".58"/>
      <path d="M113 80 H180 L216 116 V232 Q216 244 204 244 H113 Q101 244 101 232 V92 Q101 80 113 80 Z" fill="url(#mark)"/>
      <path d="M180 80 V108 Q180 116 188 116 H216" fill="#6F91DD" opacity=".82"/>
      <path d="M160 174 V118 M138 141 L160 118 L182 141" fill="none" stroke="#0A0D15" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
      <path d="M67 205 C85 228 117 236 160 236 C203 236 235 228 253 205" fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round"/>
      <circle cx="160" cy="268" r="13" fill="url(#markSoft)"/>
    </symbol>

    <symbol id="icon-processing" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path class="mark-stroke" stroke-width="38" d="M160 87 A73 73 0 0 1 224 124"/>
      <path class="mark-stroke" stroke-width="38" d="M160 87 A73 73 0 0 1 224 124" transform="rotate(120 160 160)"/>
      <path class="mark-stroke" stroke-width="38" d="M160 87 A73 73 0 0 1 224 124" transform="rotate(240 160 160)"/>
      <circle cx="219" cy="119" r="7" fill="#8D78D8" opacity=".70"/>
    </symbol>

    <symbol id="icon-command" viewBox="0 0 320 320">
      <use href="#shell-master"/>
      <path class="mark-stroke" stroke-width="28" d="M131 91 H220 Q238 91 238 109 V216 Q238 234 220 234 H131"/>
      <path class="mark-stroke" stroke-width="26" d="M82 132 L124 160 L82 188"/>
      <rect x="151" y="180" width="58" height="18" rx="9" fill="url(#markSoft)"/>
      <path d="M118 160 H169" stroke="#8D79D9" stroke-width="6" stroke-linecap="round" opacity=".52"/>
    </symbol>
  </defs>

  <rect width="1800" height="1250" fill="url(#page)"/>
  <text x="72" y="66" class="title">Optical Hero Icon · Shape Study V8</text>
  <text x="72" y="103" class="subtitle">只验证语义、比例与系列感；无复杂发光、无材质噪点、底板轮廓锁定</text>

  <g transform="translate(60 140)">
    <rect class="cell" width="520" height="485" rx="34"/>
    <use href="#icon-ai" x="44" y="28" width="300" height="300"/>
    <use href="#icon-ai" x="374" y="178" width="64" height="64"/>
    <use href="#icon-ai" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">AI Spark</text>
    <text x="44" y="410" class="meta">AI 生成 / 优化</text>
    <text x="374" y="267" class="size">64</text><text x="457" y="267" class="size">48</text>
  </g>

  <g transform="translate(640 140)">
    <rect class="cell" width="520" height="485" rx="34"/>
    <use href="#icon-warning" x="44" y="28" width="300" height="300"/>
    <use href="#icon-warning" x="374" y="178" width="64" height="64"/>
    <use href="#icon-warning" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">Warning</text>
    <text x="44" y="410" class="meta">警告 / 需要注意</text>
    <text x="374" y="267" class="size">64</text><text x="457" y="267" class="size">48</text>
  </g>

  <g transform="translate(1220 140)">
    <rect class="cell" width="520" height="485" rx="34"/>
    <use href="#icon-success" x="44" y="28" width="300" height="300"/>
    <use href="#icon-success" x="374" y="178" width="64" height="64"/>
    <use href="#icon-success" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">Success</text>
    <text x="44" y="410" class="meta">完成 / 成功</text>
    <text x="374" y="267" class="size">64</text><text x="457" y="267" class="size">48</text>
  </g>

  <g transform="translate(60 685)">
    <rect class="cell" width="520" height="485" rx="34"/>
    <use href="#icon-upload" x="44" y="28" width="300" height="300"/>
    <use href="#icon-upload" x="374" y="178" width="64" height="64"/>
    <use href="#icon-upload" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">Upload</text>
    <text x="44" y="410" class="meta">上传文件 / 素材</text>
    <text x="374" y="267" class="size">64</text><text x="457" y="267" class="size">48</text>
  </g>

  <g transform="translate(640 685)">
    <rect class="cell" width="520" height="485" rx="34"/>
    <use href="#icon-processing" x="44" y="28" width="300" height="300"/>
    <use href="#icon-processing" x="374" y="178" width="64" height="64"/>
    <use href="#icon-processing" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">Processing</text>
    <text x="44" y="410" class="meta">处理中 / 生成中</text>
    <text x="374" y="267" class="size">64</text><text x="457" y="267" class="size">48</text>
  </g>

  <g transform="translate(1220 685)">
