    <use href="#icon-command" x="44" y="28" width="300" height="300"/>
    <use href="#icon-command" x="374" y="178" width="64" height="64"/>
    <use href="#icon-command" x="452" y="186" width="48" height="48"/>
    <text x="44" y="379" class="label">Command Entry</text>
    <text x="44" y="410" class="meta">输入 / 提交指令</text>
